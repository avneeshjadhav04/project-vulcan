services:
  api:
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:/data/vulcan.db
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY is required}
      ADMIN_DEFAULT_EMAIL: ${ADMIN_DEFAULT_EMAIL:-admin@local.local}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:?ADMIN_DEFAULT_PASSWORD is required}
      NIM_BASE_URL: ${NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      RUST_LOG: ${RUST_LOG:-info}
      BIND_ADDR: 0.0.0.0:8080
    volumes:
      - ./data:/data
      - ./workspace:/app/workspace
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
