# Render Blueprint with Disk for SQLite persistence
# NOTE: Free plan does not support disks. Use Starter plan or higher.

services:
  - type: web
    name: carbon-ai
    runtime: docker
    repo: https://github.com/avneeshjadhav04/ai-assistant
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        value: sqlite:/data/carbon_ai.db
      - key: MASTER_KEY
        generateValue: true
      - key: ADMIN_DEFAULT_EMAIL
        value: admin@local.local
      - key: ADMIN_DEFAULT_PASSWORD
        generateValue: true
      - key: NIM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: RUST_LOG
        value: info
    disk:
      name: carbon-ai-data
      mountPath: /data
      sizeGB: 1
    healthCheckPath: /api/health
