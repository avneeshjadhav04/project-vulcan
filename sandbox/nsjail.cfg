mode: ONCE
uidmap {
    inside_id: "nobody"
}
gidmap {
    inside_id: "nogroup"
}
mount {
    src: "/bin"
    dst: "/bin"
    is_bind: true
    rw: false
}
mount {
    src: "/usr/bin"
    dst: "/usr/bin"
    is_bind: true
    rw: false
}
mount {
    src: "/lib"
    dst: "/lib"
    is_bind: true
    rw: false
}
mount {
    src: "/lib64"
    dst: "/lib64"
    is_bind: true
    rw: false
}
mount {
    src: "/usr/lib"
    dst: "/usr/lib"
    is_bind: true
    rw: false
}
mount {
    src: "/tmp"
    dst: "/tmp"
    is_bind: true
    rw: true
}
mount {
    src: "/dev/null"
    dst: "/dev/null"
    is_bind: true
    rw: true
}
mount {
    src: "/dev/zero"
    dst: "/dev/zero"
    is_bind: true
    rw: true
}
mount {
    src: "/dev/random"
    dst: "/dev/random"
    is_bind: true
    rw: true
}
mount {
    src: "/dev/urandom"
    dst: "/dev/urandom"
    is_bind: true
    rw: true
}
rlimit_as: 536870912
rlimit_cpu: 30
rlimit_nofile: 64
rlimit_nproc: 10
disable_clone_newnet: false
